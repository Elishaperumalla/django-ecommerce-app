{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce</title>
    <link rel="stylesheet" href="{% static 'E_com_App/register/css/style.css' %}">
</head>
<body>

<div class="navbar">
    <div class="navbar-left">
        <div class="navbar-brand">My Shop</div>
        <div class="navbar-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'products' %}">Products</a>
            <a href="{% url 'cart' %}">Cart</a>
            <a href="{% url 'wishlist' %}">Wishlist</a>
        </div>
        <form class="navbar-search" method="get" action="{% url 'products' %}">
            <select name="category" aria-label="Filter by category">
                <option value="">All categories</option>
                {% for c in nav_categories %}
                    <option value="{{ c.id }}" {% if request.GET.category|stringformat:"s" == c.id|stringformat:"s" %}selected{% endif %}>
                        {{ c.name }}
                    </option>
                {% endfor %}
            </select>
            <input name="q" value="{{ request.GET.q }}" placeholder="Search products..." aria-label="Search products">
            <button type="submit">Search</button>
        </form>
    </div>

    <div class="navbar-auth">
        {% if user.is_authenticated %}
            <div class="user-menu">
                <button class="user-menu-trigger" type="button" aria-expanded="false">Hi, {{ user.username }}</button>
                <div class="user-menu-panel" role="menu">
                    <a href="{% url 'profile' %}" role="menuitem">User Profile</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" role="menuitem">Logout</button>
                    </form>
                </div>
            </div>
        {% else %}
            <a class="btn-pill" href="{% url 'login' %}">Login</a>
            <a class="btn-pill primary" href="{% url 'register' %}">Sign up</a>
        {% endif %}
    </div>
</div>

<div class="page">
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}
    {% endblock %}
</div>

<script>
    const HOME_URL = "{% url 'home' %}";
</script>
<script src="{% static 'E_com_App/register/js/main.js' %}">
</script>
</body>
</html>
