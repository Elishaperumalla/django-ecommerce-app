{% extends 'E_com_App/register/base.html' %}

{% block content %}
<div class="section-card">
    <h2>{{ product.name }}</h2>
    {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" style="width:100%; max-width:360px; border-radius:0.6rem; margin-bottom:0.8rem;">
    {% endif %}

    <p>{{ product.description }}</p>
    <p class="product-price">Price: ₹{{ product.price }}</p>

    <div class="product-actions" style="max-width:320px;">
        <a class="btn-pill primary" href="{% url 'add_to_cart' product.id %}">Add to Cart</a>
        <a class="btn-pill" href="{% url 'add_to_wishlist' product.id %}">Wishlist</a>
    </div>
</div>
{% endblock %}
